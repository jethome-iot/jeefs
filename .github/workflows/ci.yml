name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── C / C++ build + ctest (includes C, C++, Python, Rust verifiers) ──
  build-and-test:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        # No-op on a provisioned runner: skips apt (and its lock) entirely.
        run: |
          dpkg -s cmake zlib1g-dev python3 pkg-config >/dev/null 2>&1 || {
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y cmake zlib1g-dev python3 pkg-config
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('rust/jeefs-header/Cargo.lock', 'rust/jeefs-header/Cargo.toml') }}
          restore-keys: cargo-deps-${{ runner.os }}-

      - name: CMake configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: CMake build (C, C++, Rust verifiers)
        run: cmake --build build

      - name: Run all ctest (C / C++ / Python / Rust cross-language)
        run: cd build && ctest --verbose --output-on-failure

      - name: Show test results
        if: always()
        run: cat build/Testing/Temporary/LastTest.log >> "$GITHUB_STEP_SUMMARY"

      - name: Install and build an external consumer (#23)
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/jeefs-prefix"
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/use.c" <<'EOC'
          #include <jeefs_header.h>
          #include <jeefs_devid.h>
          int main(void) {
              unsigned char h[256], r[256];
              jeefs_header_init(h, sizeof(h), 4);
              jeefs_devid_init(r, sizeof(r));
              return jeefs_header_verify_crc(h, sizeof(h)) || jeefs_devid_verify_crc(r, sizeof(r));
          }
          EOC
          cat > "$RUNNER_TEMP/consumer/CMakeLists.txt" <<'EOC'
          cmake_minimum_required(VERSION 3.19)
          project(consumer C)
          find_package(jeefs REQUIRED)
          add_executable(use use.c)
          target_link_libraries(use jeefs::header)
          EOC
          cmake -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/build" \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/jeefs-prefix"
          cmake --build "$RUNNER_TEMP/consumer/build"
          "$RUNNER_TEMP/consumer/build/use"
          PKG_CONFIG_PATH="$RUNNER_TEMP/jeefs-prefix/lib/pkgconfig" \
            pkg-config --exists --print-errors jeefs jeefs-header

  # ── Rust unit tests ──
  rust-tests:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('rust/jeefs-header/Cargo.lock', 'rust/jeefs-header/Cargo.toml') }}
          restore-keys: cargo-deps-${{ runner.os }}-

      - name: Rust unit tests
        run: cargo test --manifest-path rust/jeefs-header/Cargo.toml --verbose

  # ── Python tests ──
  python-tests:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python package with test deps
        run: pip install -e "python/[test]"

      - name: Run pytest
        run: python -m pytest python/tests/ -v

      - name: Run codegen parser tests
        working-directory: tools
        run: python -m pytest tests/ -v

  # ── Code generation validation ──
  codegen-check:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check version.json is the single version source
        run: python tools/sync_version.py --check

      - name: Validate specs (no output, just check parsing)
        working-directory: tools
        run: |
          python -m jeefs_codegen \
            --specs ../docs/format/header-common.md \
                    ../docs/format/header-v1.md \
                    ../docs/format/header-v2.md \
                    ../docs/format/header-v3.md \
                    ../docs/format/header-v4.md \
                    ../docs/format/device-identity-v1.md \
                    ../docs/format/filesystem-v1.md \
            --validate-only

      - name: Check generated C header is up-to-date
        working-directory: tools
        run: |
          python -m jeefs_codegen \
            --specs ../docs/format/header-common.md \
                    ../docs/format/header-v1.md \
                    ../docs/format/header-v2.md \
                    ../docs/format/header-v3.md \
                    ../docs/format/header-v4.md \
                    ../docs/format/device-identity-v1.md \
                    ../docs/format/filesystem-v1.md \
            --c-output /tmp/jeefs_generated.h
          diff -u ../include/jeefs_generated.h /tmp/jeefs_generated.h

      - name: Check generated Python constants are up-to-date
        working-directory: tools
        run: |
          python -m jeefs_codegen \
            --specs ../docs/format/header-common.md \
                    ../docs/format/header-v1.md \
                    ../docs/format/header-v2.md \
                    ../docs/format/header-v3.md \
                    ../docs/format/header-v4.md \
                    ../docs/format/device-identity-v1.md \
                    ../docs/format/filesystem-v1.md \
            --py-output /tmp/constants_generated.py
          diff -u ../python/jeefs/constants_generated.py /tmp/constants_generated.py

      - name: Check generated Rust module is up-to-date
        working-directory: tools
        run: |
          python -m jeefs_codegen \
            --specs ../docs/format/header-common.md \
                    ../docs/format/header-v1.md \
                    ../docs/format/header-v2.md \
                    ../docs/format/header-v3.md \
                    ../docs/format/header-v4.md \
                    ../docs/format/device-identity-v1.md \
                    ../docs/format/filesystem-v1.md \
            --rs-output /tmp/generated.rs
          diff -u ../rust/jeefs-header/src/generated.rs /tmp/generated.rs

  # ── ASan/UBSan: full ctest under sanitizers (#20) ──
  sanitizers:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        # No-op on a provisioned runner: skips apt (and its lock) entirely.
        run: |
          dpkg -s cmake zlib1g-dev python3 >/dev/null 2>&1 || {
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y cmake zlib1g-dev python3
          }

      - name: Configure with ASan/UBSan
        run: >
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build-asan

      - name: Run ctest under sanitizers
        run: cd build-asan && ctest --output-on-failure

  # ── Strict warnings: the tree must build with -Wall -Wextra -Wvla -Werror (#20) ──
  strict-warnings:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        # No-op on a provisioned runner: skips apt (and its lock) entirely.
        run: |
          dpkg -s cmake zlib1g-dev python3 >/dev/null 2>&1 || {
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y cmake zlib1g-dev python3
          }

      - name: Configure with strict warnings
        run: >
          cmake -B build-strict -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS="-Wall -Wextra -Wvla -Werror"
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wvla -Werror"

      - name: Build
        run: cmake --build build-strict

  # ── Freestanding smoke: the core compiles for bare targets (#24) ──
  freestanding-smoke:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross toolchains
        # No-op on a provisioned runner: skips apt (and its lock) entirely.
        run: |
          dpkg -s gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu >/dev/null 2>&1 || {
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu
          }

      - name: Compile the core freestanding (aarch64, riscv64)
        # Compile-only with -ffreestanding: proves the libraries carry no
        # hosted assumptions (POSIX, stdio, zlib). The deployment targets
        # are all little-endian; the required libc surface (memcpy & co)
        # is documented in docs/PORTING.md.
        run: |
          for cc in aarch64-linux-gnu-gcc riscv64-linux-gnu-gcc; do
            for src in src/jeefs_header.c src/jeefs_devid.c src/jeefs_crc32.c src/jeefs.c; do
              "$cc" -c -ffreestanding -Os -Wall -Wextra -Wvla -Werror \
                -Iinclude -o /tmp/jeefs_smoke.o "$src"
            done
            echo "$cc: OK"
          done

  # ── Fuzz smoke: bounded libFuzzer run over the buffer APIs ──
  fuzz-smoke:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang
        # No-op on a provisioned runner: skips apt (and its lock) entirely.
        run: |
          dpkg -s clang cmake >/dev/null 2>&1 || {
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y clang cmake
          }

      - name: Build fuzzers
        run: >
          CC=clang CXX=clang++ cmake -B build-fuzz -DJEEFS_BUILD_FUZZERS=ON
          -DJEEFS_BUILD_TESTS=OFF -DJEEFS_BUILD_EXAMPLES=OFF -DJEEFS_INSTALL=OFF
          && cmake --build build-fuzz

      - name: Fuzz (seeded, bounded)
        # Committed goldens and vectors are the seed corpus; 60s per target
        # keeps PR latency sane — this is a regression fuzz, not a campaign.
        run: |
          rm -rf /tmp/crashes && mkdir -p /tmp/crashes
          mkdir -p /tmp/corpus_fs /tmp/corpus_hdr /tmp/corpus_devid
          cp test-vectors/reference/*.bin /tmp/corpus_fs/
          cp test-vectors/vectors/v*.bin /tmp/corpus_hdr/
          cp test-vectors/vectors/devid_*.bin /tmp/corpus_devid/
          ./build-fuzz/fuzz/fuzz_fs -max_total_time=60 -max_len=8192 -artifact_prefix=/tmp/crashes/ /tmp/corpus_fs
          ./build-fuzz/fuzz/fuzz_header -max_total_time=60 -max_len=1024 -artifact_prefix=/tmp/crashes/ /tmp/corpus_hdr
          ./build-fuzz/fuzz/fuzz_devid -max_total_time=60 -max_len=512 -artifact_prefix=/tmp/crashes/ /tmp/corpus_devid

      - name: Dump crash artifacts to the log
        if: failure()
        run: |
          for f in /tmp/crashes/*; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            base64 "$f"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes
          path: /tmp/crashes/
          if-no-files-found: ignore

  # ── clang-format: committed sources match .clang-format (#20) ──
  format-check:
    runs-on: [self-hosted, amd64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Same major as the tree was formatted with; generated header excluded —
      # its layout is owned by the code generator (docs/CODEGEN.md).
      - name: Install pinned clang-format
        run: pip install clang-format==22.1.8

      - name: Check formatting
        run: |
          git ls-files '*.c' '*.h' '*.hpp' '*.cpp' \
            | grep -v '^include/jeefs_generated\.h$' \
            | xargs clang-format --dry-run --Werror

  # ── Publish to crates.io (on tag push, or manual dispatch for backfill) ──
  publish-crates:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-and-test, rust-tests, python-tests, codegen-check, sanitizers, strict-warnings, format-check]
    runs-on: [self-hosted, amd64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CRATE_VERSION=$(grep -m1 '^version' rust/jeefs-header/Cargo.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match crate version $CRATE_VERSION"
            exit 1
          fi

      - name: Publish to crates.io
        working-directory: rust/jeefs-header
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish --locked

  # ── Publish to PyPI (on tag push only) ──
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, rust-tests, python-tests, codegen-check, sanitizers, strict-warnings, format-check]
    runs-on: [self-hosted, amd64]
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build python/ --outdir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # ── GitHub Release with generated notes + artifacts (on tag push) ──
  publish-release:
    # Gated on the test matrix, not the registry publishes: an immutable
    # registry conflict must not block the GitHub Release for a green tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, rust-tests, python-tests, codegen-check, sanitizers, strict-warnings, format-check]
    runs-on: [self-hosted, amd64]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify tag matches version.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          SRC_VERSION=$(python -c "import json; print(json.load(open('version.json'))['stable'])")
          if [ "$TAG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match version.json stable $SRC_VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build python/ --outdir dist/

      - name: Package crate
        working-directory: rust/jeefs-header
        run: cargo package --locked

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            rust/jeefs-header/target/package/*.crate
