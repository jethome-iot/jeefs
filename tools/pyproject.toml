[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "jeefs-codegen"
version = "0.11.1"
description = "JEEFS code generator — produces C and Python from markdown format specs"
license = "GPL-2.0-or-later OR Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Viacheslav Bocharov", email = "vb@jethome.com"}]

[project.scripts]
jeefs-codegen = "jeefs_codegen.__main__:main"

[tool.uv]
# Supply-chain cooldown (#22): ignore releases younger than 7 days
exclude-newer = "7 days"
